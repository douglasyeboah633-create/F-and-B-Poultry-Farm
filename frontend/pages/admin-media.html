<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Manager - F and B Poultry Farm Limited</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #1b4332;
            color: white;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar .logo { text-align: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sidebar .logo h2 { font-size: 18px; }
        .sidebar .logo p { font-size: 12px; color: #95d5b2; }
        .sidebar nav a { display: block; color: white; text-decoration: none; padding: 12px 15px; margin: 5px 0; border-radius: 8px; transition: background 0.3s; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #2d6a4f; }
        .sidebar nav a .icon { margin-right: 10px; }

        /* Main Content */
        .main-content { margin-left: 250px; padding: 20px; }
        .header { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header h1 { color: #1b4332; font-size: 24px; }
        .header .user-info { color: #666; }

        /* Upload Section */
        .upload-section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .upload-section h2 { color: #1b4332; margin-bottom: 20px; }
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .upload-box { border: 2px dashed #ccc; border-radius: 10px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-box:hover { border-color: #2d6a4f; background: #f0f7f4; }
        .upload-box .icon { font-size: 40px; margin-bottom: 10px; }
        .upload-box h3 { color: #2d6a4f; margin-bottom: 5px; }
        .upload-box p { color: #666; font-size: 14px; }
        .upload-box input[type="file"] { display: none; }

        /* Media Grid */
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .media-item { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .media-item img, .media-item video { width: 100%; height: 150px; object-fit: cover; }
        .media-item .media-info { padding: 10px; }
        .media-item .media-info p { font-size: 12px; color: #666; margin-bottom: 5px; }
        .media-item .media-actions { padding: 10px; display: flex; gap: 10px; }
        .media-item .media-actions button { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .btn-copy { background: #2196f3; color: white; }
        .btn-delete { background: #f44336; color: white; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar .logo h2, .sidebar .logo p, .sidebar nav a span { display: none; }
            .main-content { margin-left: 60px; }
            .upload-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <h2>🐔 F and B Poultry</h2>
            <p>Media Manager</p>
        </div>
        <nav>
            <a href="admin-dashboard.html"><span class="icon">📊</span><span>Dashboard</span></a>
            <a href="admin-products.html"><span class="icon">📦</span><span>Products</span></a>
            <a href="admin-orders.html"><span class="icon">📋</span><span>Orders</span></a>
            <a href="admin-payments.html"><span class="icon">💳</span><span>Payments</span></a>
            <a href="admin-customers.html"><span class="icon">👥</span><span>Customers</span></a>
            <a href="admin-ads.html"><span class="icon">📢</span><span>Advertisements</span></a>
            <a href="admin-media.html" class="active"><span class="icon">🖼️</span><span>Media</span></a>
            <a href="../index.html"><span class="icon">🏠</span><span>View Website</span></a>
            <a href="#" onclick="logout()"><span class="icon">🚪</span><span>Logout</span></a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <h1>🖼️ Media Manager</h1>
            <div class="user-info">
                <span id="adminName">Admin</span> | <span id="currentDate"></span>
            </div>
        </div>

        <!-- Upload Section -->
        <div class="upload-section">
            <h2>Upload Media</h2>
            <div class="upload-grid">
                <div class="upload-box" onclick="document.getElementById('imageInput').click()">
                    <div class="icon">🖼️</div>
                    <h3>Upload Image</h3>
                    <p>JPG, PNG, GIF (Max 5MB)</p>
                    <input type="file" id="imageInput" accept="image/*" onchange="uploadFile(this, 'image')">
                </div>
                <div class="upload-box" onclick="document.getElementById('videoInput').click()">
                    <div class="icon">🎥</div>
                    <h3>Upload Video</h3>
                    <p>MP4, WebM (Max 50MB)</p>
                    <input type="file" id="videoInput" accept="video/*" onchange="uploadFile(this, 'video')">
                </div>
            </div>
        </div>

        <!-- Media Gallery -->
        <div class="upload-section">
            <h2>Uploaded Media</h2>
            <div class="media-grid" id="mediaGrid">
                <p style="color: #666; text-align: center; grid-column: 1/-1;">Loading media...</p>
            </div>
        </div>
    </div>

    <script>
        // Get token from localStorage
        const token = localStorage.getItem('token');
        const userRole = localStorage.getItem('role');

        // Check if admin
        if (!token || userRole !== 'admin') {
            window.location.href = 'login.html';
        }

        // Display admin name
        document.getElementById('adminName').textContent = localStorage.getItem('username') || 'Admin';

        // Display current date
        const now = new Date();
        document.getElementById('currentDate').textContent = now.toLocaleDateString('en-GB', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        // Upload file
        async function uploadFile(input, type) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('type', type);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.status) {
                    alert(`${type === 'image' ? 'Image' : 'Video'} uploaded successfully!`);
                    loadMedia();
                } else {
                    alert(data.message || 'Upload failed');
                }
            } catch (error) {
                alert('Error uploading file: ' + error.message);
            }

            input.value = '';
        }

        // Load media
        async function loadMedia() {
            const grid = document.getElementById('mediaGrid');

            try {
                const response = await fetch('/api/media', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.status && data.data.length > 0) {
                    grid.innerHTML = data.data.map(item => `
                        <div class="media-item">
                            ${item.type === 'image' 
                                ? `<img src="${item.url}" alt="${item.filename}">` 
                                : `<video src="${item.url}" controls></video>`}
                            <div class="media-info">
                                <p>${item.filename}</p>
                                <p>${item.size}</p>
                            </div>
                            <div class="media-actions">
                                <button class="btn-copy" onclick="copyUrl('${item.url}')">Copy URL</button>
                                <button class="btn-delete" onclick="deleteMedia('${item.filename}')">Delete</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<p style="color: #666; text-align: center; grid-column: 1/-1;">No media uploaded yet</p>';
                }
            } catch (error) {
                grid.innerHTML = '<p style="color: #666; text-align: center; grid-column: 1/-1;">Error loading media</p>';
            }
        }

        // Copy URL
        function copyUrl(url) {
            navigator.clipboard.writeText(window.location.origin + url).then(() => {
                alert('URL copied to clipboard!');
            });
        }

        // Delete media
        async function deleteMedia(filename) {
            if (!confirm('Are you sure you want to delete this file?')) return;

            try {
                const response = await fetch(`/api/media/${filename}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (data.status) {
                    alert('File deleted successfully!');
                    loadMedia();
                } else {
                    alert(data.message || 'Delete failed');
                }
            } catch (error) {
                alert('Error deleting file: ' + error.message);
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('role');
            localStorage.removeItem('username');
            localStorage.removeItem('email');
            window.location.href = 'login.html';
        }

        // Initialize
        loadMedia();
    </script>
</body>
</html>
